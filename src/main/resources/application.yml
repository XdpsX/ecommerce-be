server:
  port: ${SERVER_PORT:8080}
#  compression: # Using GZIP to compress API data
#    enabled: true
#    mime-types: application/json

spring:
  application:
    name: ecommerce
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  pattern:
    # Renders the MDC value published by CorrelationIdFilter; empty when no request context is bound.
    correlation: "[correlationId=%X{correlationId:-}] "

cloudinary:
  http:
    timeout: ${CLOUDINARY_HTTP_TIMEOUT:10}

app:
  store:
    currency: ${APP_STORE_CURRENCY:VND}
  auth-session:
    expected-issuer: ${APP_AUTH_EXPECTED_ISSUER:xdpsx.com}
    local-access-token-lifetime: ${APP_LOCAL_ACCESS_TOKEN_LIFETIME:15m}
    refresh-session-lifetime: ${APP_REFRESH_SESSION_LIFETIME:30d}
    refresh-cookie-name: ${APP_REFRESH_COOKIE_NAME:refresh_session}
    refresh-cookie-path: ${APP_REFRESH_COOKIE_PATH:/auth}
    refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Strict}
    guard-header-name: ${APP_SESSION_REQUEST_HEADER:X-Session-Request}
    guard-header-value: ${APP_SESSION_REQUEST_HEADER_VALUE:1}
  cart:
    guest-lifetime: ${APP_CART_GUEST_LIFETIME:30d}
    guest-cookie-name: ${APP_CART_GUEST_COOKIE_NAME:guest_cart}
    guest-cookie-path: ${APP_CART_GUEST_COOKIE_PATH:/cart}
    guest-cookie-secure: ${APP_CART_GUEST_COOKIE_SECURE:true}
    guest-cookie-same-site: ${APP_CART_GUEST_COOKIE_SAME_SITE:Lax}
    guard-header-name: ${APP_CART_REQUEST_HEADER:X-Cart-Request}
    guard-header-value: ${APP_CART_REQUEST_HEADER_VALUE:1}
    cleanup-batch-size: ${APP_CART_CLEANUP_BATCH_SIZE:100}
    cleanup-fixed-delay-ms: ${APP_CART_CLEANUP_FIXED_DELAY_MS:3600000}
  checkout:
    reservation-lifetime: ${APP_CHECKOUT_RESERVATION_LIFETIME:15m}
    cleanup-batch-size: ${APP_CHECKOUT_CLEANUP_BATCH_SIZE:100}
    cleanup-fixed-delay-ms: ${APP_CHECKOUT_CLEANUP_FIXED_DELAY_MS:60000}
  payment-attempt:
    lifetime: ${APP_PAYMENT_ATTEMPT_LIFETIME:15m}

media:
  upload:
    intent-lifetime: ${MEDIA_UPLOAD_INTENT_LIFETIME:1h}
    max-file-size: ${MEDIA_UPLOAD_MAX_FILE_SIZE:2MB}
    authorization-lifetime: ${MEDIA_UPLOAD_AUTHORIZATION_LIFETIME:1h}
    completion-grace: ${MEDIA_UPLOAD_COMPLETION_GRACE:10m}
    clock-skew-tolerance: ${MEDIA_UPLOAD_CLOCK_SKEW_TOLERANCE:2m}
    replay-grace: ${MEDIA_UPLOAD_REPLAY_GRACE:10m}
  cloudinary:
    eager-notification-url: ${CLOUDINARY_EAGER_NOTIFICATION_URL:}
    webhook-timestamp-tolerance: ${CLOUDINARY_WEBHOOK_TIMESTAMP_TOLERANCE:2h}
  reconciliation:
    enabled: ${MEDIA_RECONCILIATION_ENABLED:false}
    fixed-delay: ${MEDIA_RECONCILIATION_FIXED_DELAY:1m}
    processing-timeout: ${MEDIA_RECONCILIATION_PROCESSING_TIMEOUT:10m}
    batch-size: ${MEDIA_RECONCILIATION_BATCH_SIZE:10}
    max-provider-requests-per-run: ${MEDIA_RECONCILIATION_MAX_PROVIDER_REQUESTS_PER_RUN:20}
    max-derived-pages-per-asset: ${MEDIA_RECONCILIATION_MAX_DERIVED_PAGES_PER_ASSET:2}
    retry-delay: ${MEDIA_RECONCILIATION_RETRY_DELAY:5m}
    provider-error-backoff: ${MEDIA_RECONCILIATION_PROVIDER_ERROR_BACKOFF:15m}
    max-retry-delay: ${MEDIA_RECONCILIATION_MAX_RETRY_DELAY:24h}
    processing-recovery-horizon: ${MEDIA_RECONCILIATION_PROCESSING_RECOVERY_HORIZON:7d}
    pending-upload-retry-window: ${MEDIA_RECONCILIATION_PENDING_UPLOAD_RETRY_WINDOW:24h}
    pending-upload-retry-delay: ${MEDIA_RECONCILIATION_PENDING_UPLOAD_RETRY_DELAY:15m}
    pending-upload-retry-max-delay: ${MEDIA_RECONCILIATION_PENDING_UPLOAD_RETRY_MAX_DELAY:24h}
    legacy-lookup-race-window: ${MEDIA_RECONCILIATION_LEGACY_LOOKUP_RACE_WINDOW:10m}
