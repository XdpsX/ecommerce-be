spring:
  #  # uncomment this code if you are using .env file to define environment variables
  #  config:
  #    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 2MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
    username: ${DB_USER:xdpsx}
    password: ${DB_PASSWORD:xdpsxpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
#      cache:
#        use_second_level_cache: true
#        region.factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

#springdoc:
#  api-docs:
#    enabled: true
#  swagger-ui:
#    enabled: true
springdoc:
  override-with-generic-response: false
openapi:
  service:
    api-docs: ecommerce-be
    server: http://localhost:${server.port}
    title: Backend service
    version: ${REVISION:1.0.0}
    description: "API documents for Ecommerce Backend"

cloudinary:
  api:
    key: ${CLOUDINARY_API_KEY}
    secret: ${CLOUDINARY_API_SECRET}
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration:
      seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3001/oauth2/redirect}
    error-uri: ${OAUTH2_ERROR_URI:http://localhost:3001/login}

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    secret-key: ${VNPAY_SECRET_KEY}
    init-payment-url: ${VNPAY_INIT_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3001/payments/%s/redirect}
    timeout: ${VNPAY_TIMEOUT_MINUTES:15} # in minutes
